<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Trees In The Neighborhood</title>
	<link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
<style>
	* {
		margin: 0;
		padding: 0;
		box-sizing: border-box;
		font-family: "Lucida Fax", "Lucida Bright", serif;
	}

	body {
		background: #EEE9BF;
		color: #222;
	}

	header {
		background: #79864B;
		color: #fff;
		padding: 8px 16px;
		display: flex;
		align-items: center;
		justify-content: space-between;
		gap: 10px;
	}

	.header-left {
		display: flex;
		align-items: center;
		gap: 8px;
	}

	header h1 {
		font-size: 18px;
	}

	.header-center {
		flex: 1;
		display: flex;
		justify-content: center;
	}

	.search-bar {
		width: 100%;
		max-width: 400px;
		padding: 6px 12px;
		border-radius: 20px;
		border: none;
		font-size: 14px;
	}

	.header-right {
		display: flex;
		align-items: center;
		gap: 10px;
	}

	.action-icon {
		width: 28px;
		height: 28px;
		cursor: pointer;
		border-radius: 50%;
		object-fit: cover;
	}

	.action-icon:hover {
		opacity: 0.8;
	}

	.container {
		display: grid;
		grid-template-columns: 200px 1fr;
		gap: 16px;
		padding: 16px;
	}
	
	footer {
    text-align: center;
    font-size: 11px;
    padding: 10px;
    color: #666;
	}
	
	.header-title {
		display: flex;
		flex-direction: column;
		font-weight: bold;
		line-height: 1.1;
	}

	.layer {
		font-size: 22px;
		display: flex;
		align-items: center;
		gap: 6px;
	}
</style>


</head>
<body>
<header>
    <div class="header-left">
        <h1 class='header-title'>
			<span class='layer'>Trees</span>
			<span class='layer'>In The</span>
			<span class='layer'>Neighborhood</span>
		</h1>
    </div>

    <div class="header-center">
        <input type="text" placeholder="Search trees, posts..." class="search-bar">
    </div>
	
    <div class="header-right">
        <img src="icons/post.png" alt="Post" class="action-icon" title="Create Post">
        <img src="icons/notification.png" alt="Notifications" class="action-icon" title="Notifications">
        <img src="icons/user.png" alt="User" class="action-icon" title="Profile">
    </div>	
	
</header>

<div class="container">

</div>
<footer style="margin-top: 50px;">
    Trees In The Neighborhood © 2026
</footer>
</body>
</html>
